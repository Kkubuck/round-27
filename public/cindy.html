<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>ROUND 27 — AMRAP TIMER</title>
    <style>
      :root {
        color-scheme: dark;
        --black: #000;
        --surface: #0a0a0a;
        --surface-2: #121212;
        --white: #fff;
        --soft: #c8c8c8;
        --muted: #707070;
        --line: #292929;
      }

      * { box-sizing: border-box; }

      html, body { margin: 0; min-width: 320px; min-height: 100%; background: #111; }

      body {
        display: grid;
        min-height: 100svh;
        place-items: center;
        overflow-x: hidden;
        color: var(--white);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      }

      button, input { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--white); outline-offset: 3px; }

      .story {
        position: relative;
        display: flex;
        container-type: inline-size;
        width: min(100vw, calc(100svh * 0.5625));
        aspect-ratio: 9 / 16;
        max-height: 100svh;
        flex-direction: column;
        gap: clamp(12px, 1.8vh, 28px);
        padding:
          max(clamp(22px, 3.1vh, 54px), env(safe-area-inset-top))
          clamp(18px, 2.5vw, 42px)
          max(clamp(20px, 2.8vh, 48px), env(safe-area-inset-bottom));
        overflow: hidden;
        background: var(--black);
        isolation: isolate;
        animation: app-enter 480ms cubic-bezier(.22, 1, .36, 1) both;
      }

      .topline, .section-head, .actions, .utility, .pace, .scheme {
        display: flex;
        align-items: center;
      }

      .topline, .section-head { justify-content: space-between; gap: 12px; }

      .topline > *, .section-head > *, .pace > *, .result-top > * { min-width: 0; }

      .wordmark {
        overflow: hidden;
        font-size: clamp(1rem, 2.2vh, 2rem);
        font-weight: 900;
        letter-spacing: -0.05em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .wordmark span {
        margin-left: 7px;
        color: var(--muted);
        font-size: 0.42em;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--soft);
        font-size: clamp(0.55rem, 0.78vh, 0.72rem);
        font-weight: 800;
        letter-spacing: 0.16em;
        flex: none;
        white-space: nowrap;
        transition: color 240ms ease;
      }

      .status::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--muted);
        content: "";
        transition: background-color 240ms ease, box-shadow 240ms ease, transform 240ms ease;
      }

      body.is-running .status::before { background: var(--white); box-shadow: 0 0 12px rgba(255,255,255,.55); }
      body.is-paused .status::before { background: #8b8b8b; }

      .label {
        margin: 0;
        color: var(--muted);
        font-size: clamp(0.52rem, 0.72vh, 0.68rem);
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .time-block {
        padding: clamp(14px, 1.8vh, 28px) 0 clamp(10px, 1.4vh, 22px);
        border-bottom: 1px solid var(--line);
      }

      .time {
        margin: clamp(5px, .7vh, 12px) 0 0 -0.06em;
        font-family: Impact, "Arial Narrow", sans-serif;
        font-size: clamp(4.8rem, 12.5vh, 12rem);
        font-weight: 900;
        line-height: .78;
        letter-spacing: -0.085em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transition: color 260ms ease, opacity 180ms ease;
      }

      .time.is-low { color: #b0b0b0; }

      .time-track, .round-track {
        width: 100%;
        overflow: hidden;
        background: #202020;
      }

      .time-track { height: 2px; margin-top: clamp(14px, 2vh, 30px); }
      .round-track { height: 3px; margin-top: clamp(9px, 1.2vh, 18px); }

      .time-fill, .round-fill {
        width: 0;
        height: 100%;
        background: var(--white);
        transform: translateZ(0);
        transition: width 180ms linear;
        will-change: width;
      }

      .rounds-block { padding: clamp(4px, .6vh, 10px) 0; }

      .goal {
        color: var(--soft);
        font-size: clamp(0.55rem, .78vh, .72rem);
        font-weight: 800;
        letter-spacing: .12em;
      }

      .round-count {
        display: flex;
        align-items: baseline;
        margin-top: clamp(3px, .4vh, 7px);
        font-family: Impact, "Arial Narrow", sans-serif;
        font-size: clamp(5.4rem, 13.5vh, 13rem);
        font-weight: 900;
        line-height: .8;
        letter-spacing: -.07em;
        font-variant-numeric: tabular-nums;
        min-width: 0;
        white-space: nowrap;
        transform-origin: left center;
      }

      .round-count span {
        margin-left: 8px;
        color: var(--muted);
        font-family: Inter, ui-sans-serif, sans-serif;
        font-size: .18em;
        font-weight: 750;
        letter-spacing: -.02em;
        flex: none;
      }

      .pace {
        justify-content: space-between;
        gap: 18px;
        padding: clamp(12px, 1.7vh, 24px) 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .pace-time {
        margin-top: 4px;
        font-family: Impact, "Arial Narrow", sans-serif;
        font-size: clamp(2.35rem, 5.5vh, 5rem);
        font-weight: 900;
        line-height: .88;
        letter-spacing: -.06em;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        transition: color 240ms ease;
      }

      .pace-time.is-over { color: #8c8c8c; }

      .pace-stats { display: flex; flex: none; gap: clamp(15px, 2.2vw, 34px); text-align: right; }

      .pace-stat span {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: clamp(.48rem, .64vh, .6rem);
        font-weight: 800;
        letter-spacing: .14em;
      }

      .pace-stat strong {
        display: block;
        font-size: clamp(.86rem, 1.55vh, 1.3rem);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .scheme {
        justify-content: space-between;
        gap: 8px;
        padding: clamp(6px, .8vh, 12px) 0;
      }

      .movement { display: grid; min-width: 0; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 7px; }
      .movement strong { font-size: clamp(.9rem, 1.5vh, 1.25rem); }
      .movement span { overflow: hidden; color: var(--muted); font-size: clamp(.48rem, .62vh, .58rem); font-weight: 800; letter-spacing: .1em; text-overflow: ellipsis; white-space: nowrap; }

      .actions { gap: 8px; margin-top: auto; }

      .action {
        min-height: clamp(48px, 6.8vh, 76px);
        border: 1px solid var(--white);
        border-radius: 0;
        font-size: clamp(.68rem, .9vh, .82rem);
        font-weight: 900;
        letter-spacing: .14em;
        text-transform: uppercase;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease, transform 150ms ease;
      }

      .start-action { flex: 1; color: var(--black); background: var(--white); }
      .start-action:hover { background: #dedede; }
      .round-action { flex: 1.25; color: var(--white); background: var(--black); }
      .round-action:hover { background: #161616; }
      .round-action:disabled { cursor: not-allowed; border-color: var(--line); color: #4e4e4e; background: var(--black); }

      .utility { justify-content: space-between; gap: 8px; }

      .utility button {
        border: 0;
        padding: 4px 0;
        color: var(--muted);
        background: transparent;
        font-size: clamp(.5rem, .65vh, .62rem);
        font-weight: 800;
        letter-spacing: .12em;
        white-space: nowrap;
        transition: color 180ms ease, opacity 180ms ease, transform 150ms ease;
      }

      .utility button:hover { color: var(--white); }
      .utility button:disabled { cursor: not-allowed; color: #333; }

      .setup-sheet {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: end;
        padding: 16px;
        background: rgba(0, 0, 0, .78);
        backdrop-filter: blur(7px);
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition: opacity 260ms ease, visibility 260ms;
      }

      .setup-sheet.is-open { opacity: 1; pointer-events: auto; visibility: visible; }

      .setup-card {
        width: 100%;
        padding: 22px;
        border: 1px solid var(--line);
        background: #080808;
        transform: translateY(24px);
        transition: transform 320ms cubic-bezier(.22, 1, .36, 1);
      }

      .setup-sheet.is-open .setup-card { transform: translateY(0); }

      .setup-head { display: flex; align-items: center; justify-content: space-between; }
      .setup-head strong { font-size: .8rem; letter-spacing: .16em; }

      .close-setup {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        color: var(--white);
        background: transparent;
      }

      .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 14px; }

      .field { display: grid; gap: 7px; }
      .field label { min-height: 1.5em; color: var(--muted); font-size: .58rem; font-weight: 800; letter-spacing: .12em; line-height: 1.35; }
      .field input {
        width: 100%;
        height: 52px;
        border: 1px solid var(--line);
        border-radius: 0;
        padding: 0 13px;
        color: var(--white);
        background: #111;
        font-size: 1.1rem;
        font-weight: 800;
        text-align: right;
      }

      .challenge-preset {
        width: 100%;
        height: 42px;
        margin-top: 18px;
        border: 1px solid var(--line);
        color: var(--white);
        background: transparent;
        font-size: .62rem;
        font-weight: 900;
        letter-spacing: .15em;
      }

      .challenge-preset:hover { border-color: var(--white); }

      .apply-setup {
        width: 100%;
        height: 50px;
        border: 1px solid var(--white);
        color: var(--black);
        background: var(--white);
        font-size: .68rem;
        font-weight: 900;
        letter-spacing: .14em;
      }

      .result-sheet {
        position: absolute;
        inset: 0;
        z-index: 12;
        display: flex;
        flex-direction: column;
        padding:
          max(clamp(28px, 4vh, 64px), env(safe-area-inset-top))
          clamp(22px, 3vw, 48px)
          max(clamp(22px, 3vh, 48px), env(safe-area-inset-bottom));
        overflow: hidden;
        background: #000 url('./backgrounds/dawn-box.webp') center / cover no-repeat;
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
        transition: opacity 340ms ease, visibility 340ms;
      }

      .result-sheet::before {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,.36), rgba(0,0,0,.72) 62%, rgba(0,0,0,.94));
        content: "";
      }

      .result-sheet.is-open { opacity: 1; pointer-events: auto; visibility: visible; }

      .result-sheet[data-background="arena"] { background-image: url('./backgrounds/arena-light.webp'); }
      .result-sheet[data-background="concrete"] { background-image: url('./backgrounds/concrete-room.webp'); }
      .result-sheet[data-background="chalk"] { background-image: url('./backgrounds/chalk-air.webp'); }
      .result-sheet[data-background="rain"] { background-image: url('./backgrounds/rainy-warehouse.webp'); }

      .result-content, .result-actions { position: relative; z-index: 1; }
      .result-content { display: flex; min-height: 0; flex: 1; flex-direction: column; }

      .result-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: clamp(14px, 2vh, 30px);
        border-bottom: 1px solid rgba(255,255,255,.24);
      }

      .result-top strong { flex: none; font-size: clamp(.9rem, 1.7vh, 1.5rem); letter-spacing: -.03em; white-space: nowrap; }
      .result-top span { overflow: hidden; color: #b8b8b8; font-size: clamp(.5rem, .7vh, .66rem); font-weight: 800; letter-spacing: .13em; text-align: right; text-overflow: ellipsis; white-space: nowrap; }

      .result-kicker {
        margin: clamp(30px, 5.2vh, 76px) 0 0;
        color: #c2c2c2;
        font-size: clamp(.55rem, .8vh, .72rem);
        font-weight: 800;
        letter-spacing: .2em;
      }

      .result-rounds {
        margin: clamp(5px, .8vh, 12px) 0 0 -0.05em;
        font-family: Impact, "Arial Narrow", sans-serif;
        max-width: 100%;
        font-size: clamp(5rem, 34cqi, 16rem);
        font-weight: 900;
        line-height: 1.2;
        letter-spacing: -.07em;
        white-space: nowrap;
      }

      .result-rounds-label { margin: 8px 0 0; font-size: clamp(.62rem, .86vh, .78rem); font-weight: 900; letter-spacing: .22em; }

      .result-metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px;
        margin-top: clamp(28px, 4.4vh, 64px);
        background: rgba(255,255,255,.25);
      }

      .result-metric { min-width: 0; padding: clamp(14px, 2.2vh, 30px); background: rgba(0,0,0,.72); }
      .result-metric span { display: block; overflow: hidden; margin-bottom: 6px; color: #a8a8a8; font-size: clamp(.48rem, .66vh, .62rem); font-weight: 800; letter-spacing: .12em; text-overflow: ellipsis; white-space: nowrap; }
      .result-metric strong { display: block; overflow: hidden; font-size: clamp(1.25rem, 8.2cqi, 3.8rem); letter-spacing: -.05em; font-variant-numeric: tabular-nums; text-overflow: clip; white-space: nowrap; }

      .result-reps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        margin-top: 1px;
        border-top: 1px solid rgba(255,255,255,.25);
        border-bottom: 1px solid rgba(255,255,255,.25);
      }

      .result-rep { min-width: 0; padding: clamp(14px, 2.1vh, 28px) 4px; text-align: center; }
      .result-rep + .result-rep { border-left: 1px solid rgba(255,255,255,.25); }
      .result-rep strong { display: block; overflow: hidden; font-size: clamp(1.1rem, 7cqi, 2.7rem); font-variant-numeric: tabular-nums; text-overflow: clip; white-space: nowrap; }
      .result-rep span { display: block; overflow: hidden; margin-top: 5px; color: #a8a8a8; font-size: clamp(.42rem, .59vh, .56rem); font-weight: 800; letter-spacing: .07em; text-overflow: ellipsis; white-space: nowrap; }

      .background-picker {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2.2cqi, 16px);
        margin-top: clamp(14px, 2vh, 28px);
      }

      .background-choice {
        width: clamp(24px, 6cqi, 36px);
        aspect-ratio: 1;
        border: 1px solid rgba(255,255,255,.45);
        border-radius: 50%;
        padding: 0;
        box-shadow: inset 0 0 0 2px rgba(0,0,0,.5);
        transition: border-color 180ms ease, outline-color 180ms ease, transform 180ms ease;
      }

      .background-choice:hover { border-color: #fff; transform: scale(1.06); }
      .background-choice[aria-pressed="true"] { border-color: #fff; outline: 1px solid #fff; outline-offset: 3px; }
      .background-choice[data-background="dawn"] { background: #111 url('./backgrounds/dawn-box.webp') center / cover no-repeat; }
      .background-choice[data-background="arena"] { background: #111 url('./backgrounds/arena-light.webp') center / cover no-repeat; }
      .background-choice[data-background="concrete"] { background: #111 url('./backgrounds/concrete-room.webp') center / cover no-repeat; }
      .background-choice[data-background="chalk"] { background: #111 url('./backgrounds/chalk-air.webp') center / cover no-repeat; }
      .background-choice[data-background="rain"] { background: #111 url('./backgrounds/rainy-warehouse.webp') center / cover no-repeat; }

      .result-actions { display: flex; gap: 8px; margin-top: clamp(18px, 2.8vh, 40px); }
      .result-actions button { min-width: 0; min-height: clamp(46px, 6.5vh, 70px); overflow: hidden; border-radius: 0; font-size: clamp(.62rem, .82vh, .76rem); font-weight: 900; letter-spacing: .12em; text-overflow: ellipsis; white-space: nowrap; transition: color 180ms ease, background-color 180ms ease, border-color 180ms ease, transform 150ms ease; }
      .save-story { flex: 1.7; border: 1px solid var(--white); color: var(--black); background: var(--white); }
      .close-result { flex: 1; border: 1px solid rgba(255,255,255,.42); color: var(--white); background: rgba(0,0,0,.72); }

      button:active:not(:disabled) { transform: translateY(1px) scale(.99); }

      .round-count.is-bumping { animation: round-bump 300ms cubic-bezier(.22, 1, .36, 1); }

      .result-sheet.is-open .result-top,
      .result-sheet.is-open .result-kicker,
      .result-sheet.is-open .result-rounds,
      .result-sheet.is-open .result-rounds-label,
      .result-sheet.is-open .result-metrics,
      .result-sheet.is-open .result-reps,
      .result-sheet.is-open .background-picker,
      .result-sheet.is-open .result-actions {
        animation: result-rise 440ms cubic-bezier(.22, 1, .36, 1) both;
      }

      .result-sheet.is-open .result-kicker { animation-delay: 35ms; }
      .result-sheet.is-open .result-rounds, .result-sheet.is-open .result-rounds-label { animation-delay: 65ms; }
      .result-sheet.is-open .result-metrics { animation-delay: 95ms; }
      .result-sheet.is-open .result-reps { animation-delay: 125ms; }
      .result-sheet.is-open .background-picker { animation-delay: 145ms; }
      .result-sheet.is-open .result-actions { animation-delay: 175ms; }

      @keyframes app-enter {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes result-rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes round-bump {
        0% { transform: scale(1); }
        45% { transform: scale(1.035); }
        100% { transform: scale(1); }
      }

      .toast {
        position: absolute;
        right: 18px;
        bottom: 18px;
        left: 18px;
        z-index: 20;
        padding: 12px 14px;
        border: 1px solid var(--line);
        color: var(--white);
        background: #111;
        font-size: .68rem;
        font-weight: 750;
        letter-spacing: .04em;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 160ms ease, transform 160ms ease;
      }

      .toast.is-visible { opacity: 1; transform: translateY(0); }

      @media (max-aspect-ratio: 9 / 16) {
        .story { width: 100vw; height: auto; max-height: none; }
      }

      @media (min-aspect-ratio: 9 / 16) {
        .story { height: 100svh; }
      }

      @container (max-width: 350px) {
        .wordmark span { display: none; }
        .utility { gap: 5px; }
        .utility button { letter-spacing: .08em; }
        .result-actions button { letter-spacing: .08em; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <main class="story">
      <header class="topline">
        <div class="wordmark">ROUND 27 <span>CINDY / AMRAP 20</span></div>
        <div class="status" id="statusText" aria-live="polite">READY</div>
      </header>

      <section class="time-block" aria-labelledby="timeLabel">
        <p class="label" id="timeLabel">Time left</p>
        <div class="time" id="timer" aria-live="assertive">20:00</div>
        <div class="time-track" aria-hidden="true"><div class="time-fill" id="timeFill"></div></div>
      </section>

      <section class="rounds-block" aria-labelledby="roundsLabel">
        <div class="section-head">
          <p class="label" id="roundsLabel">Rounds</p>
          <span class="goal" id="goalBadge">GOAL 27</span>
        </div>
        <div class="round-count" id="setCount" aria-live="polite">0<span id="setGoal">/27</span></div>
        <div class="round-track" aria-hidden="true"><div class="round-fill" id="setFill"></div></div>
      </section>

      <section class="pace" aria-labelledby="paceLabel">
        <div>
          <p class="label" id="paceLabel">Current round</p>
          <div class="pace-time" id="roundTimer" aria-live="polite">00:44</div>
        </div>
        <div class="pace-stats">
          <div class="pace-stat"><span>TARGET</span><strong id="nextPace">00:44</strong></div>
          <div class="pace-stat"><span>LAST</span><strong id="lastSetTime">—</strong></div>
        </div>
      </section>

      <section class="scheme" aria-label="Cindy movements">
        <div class="movement"><strong>05</strong><span>PULL-UPS</span></div>
        <div class="movement"><strong>10</strong><span>PUSH-UPS</span></div>
        <div class="movement"><strong>15</strong><span>SQUATS</span></div>
      </section>

      <section class="actions" aria-label="Workout actions">
        <button class="action start-action" id="startBtn" type="button">START</button>
        <button class="action round-action" id="completeBtn" type="button" disabled>+ ROUND</button>
      </section>

      <footer class="utility">
        <button id="setupBtn" type="button">SETUP</button>
        <button id="undoBtn" type="button" disabled>UNDO</button>
        <button id="resultBtn" type="button" disabled>RESULT</button>
        <button id="resetBtn" type="button">RESET</button>
        <button id="fullscreenBtn" type="button">FULLSCREEN</button>
      </footer>

      <aside class="setup-sheet" id="setupSheet" aria-hidden="true">
        <div class="setup-card">
          <div class="setup-head"><strong>WORKOUT SETUP</strong><button class="close-setup" id="closeSetupBtn" type="button" aria-label="Close setup">×</button></div>
          <button class="challenge-preset" id="challengePresetBtn" type="button">27 ROUND CHALLENGE</button>
          <div class="fields">
            <div class="field"><label for="targetInput">GOAL ROUNDS</label><input id="targetInput" type="number" inputmode="numeric" min="1" max="999" step="1" value="27" /></div>
            <div class="field"><label for="durationInput">TIME CAP / MIN</label><input id="durationInput" type="number" inputmode="numeric" min="1" max="180" step="1" value="20" /></div>
          </div>
          <button class="apply-setup" id="applySetupBtn" type="button">APPLY</button>
        </div>
      </aside>

      <section class="result-sheet" id="resultSheet" data-background="dawn" aria-hidden="true">
        <div class="result-content">
          <div class="result-top"><strong>ROUND 27</strong><span id="resultDate">WORKOUT COMPLETE</span></div>
          <p class="result-kicker">WORKOUT COMPLETE</p>
          <div class="result-rounds" id="resultRounds">27</div>
          <p class="result-rounds-label">ROUNDS</p>
          <div class="result-metrics">
            <div class="result-metric"><span>TOTAL TIME</span><strong id="resultTotalTime">20:00</strong></div>
            <div class="result-metric"><span>AVG / ROUND</span><strong id="resultAverage">00:44</strong></div>
          </div>
          <div class="result-reps">
            <div class="result-rep"><strong id="resultPullups">135</strong><span>PULL-UPS</span></div>
            <div class="result-rep"><strong id="resultPushups">270</strong><span>PUSH-UPS</span></div>
            <div class="result-rep"><strong id="resultSquats">405</strong><span>SQUATS</span></div>
          </div>
          <div class="background-picker" aria-label="Story background">
            <button class="background-choice" type="button" data-background="dawn" aria-label="Dawn gym background" aria-pressed="true" title="Dawn gym"></button>
            <button class="background-choice" type="button" data-background="arena" aria-label="Arena background" aria-pressed="false" title="Arena"></button>
            <button class="background-choice" type="button" data-background="concrete" aria-label="Concrete gym background" aria-pressed="false" title="Concrete gym"></button>
            <button class="background-choice" type="button" data-background="chalk" aria-label="Chalk background" aria-pressed="false" title="Chalk"></button>
            <button class="background-choice" type="button" data-background="rain" aria-label="Rainy warehouse background" aria-pressed="false" title="Rainy warehouse"></button>
          </div>
        </div>
        <div class="result-actions">
          <button class="save-story" id="saveStoryBtn" type="button">SAVE STORY</button>
          <button class="close-result" id="closeResultBtn" type="button">BACK</button>
        </div>
      </section>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        const timerEl = $("timer");
        const timeFillEl = $("timeFill");
        const roundTimerEl = $("roundTimer");
        const nextPaceEl = $("nextPace");
        const lastSetTimeEl = $("lastSetTime");
        const setCountEl = $("setCount");
        const setGoalEl = $("setGoal");
        const setFillEl = $("setFill");
        const goalBadgeEl = $("goalBadge");
        const statusTextEl = $("statusText");
        const startBtn = $("startBtn");
        const completeBtn = $("completeBtn");
        const setupBtn = $("setupBtn");
        const undoBtn = $("undoBtn");
        const resultBtn = $("resultBtn");
        const resetBtn = $("resetBtn");
        const fullscreenBtn = $("fullscreenBtn");
        const setupSheet = $("setupSheet");
        const closeSetupBtn = $("closeSetupBtn");
        const challengePresetBtn = $("challengePresetBtn");
        const applySetupBtn = $("applySetupBtn");
        const targetInput = $("targetInput");
        const durationInput = $("durationInput");
        const resultSheet = $("resultSheet");
        const resultDateEl = $("resultDate");
        const resultRoundsEl = $("resultRounds");
        const resultTotalTimeEl = $("resultTotalTime");
        const resultAverageEl = $("resultAverage");
        const resultPullupsEl = $("resultPullups");
        const resultPushupsEl = $("resultPushups");
        const resultSquatsEl = $("resultSquats");
        const saveStoryBtn = $("saveStoryBtn");
        const closeResultBtn = $("closeResultBtn");
        const toastEl = $("toast");
        const backgroundChoices = [...document.querySelectorAll(".background-choice")];

        let state = "idle";
        let targetSets = 27;
        let durationMs = 20 * 60 * 1000;
        let remainingMs = durationMs;
        let setsDone = 0;
        let endAt = 0;
        let tickHandle = null;
        let toastHandle = null;
        let resetArmUntil = 0;
        let currentSetBudgetMs = durationMs / targetSets;
        let roundElapsedMs = 0;
        let roundStartedAt = 0;
        let lastSetDurationMs = null;
        const backgroundAssets = {
          dawn: "./backgrounds/dawn-box.webp",
          arena: "./backgrounds/arena-light.webp",
          concrete: "./backgrounds/concrete-room.webp",
          chalk: "./backgrounds/chalk-air.webp",
          rain: "./backgrounds/rainy-warehouse.webp",
        };
        const backgroundPresets = new Set(Object.keys(backgroundAssets));
        let storyBackground = "dawn";

        const saved = (() => {
          try { return JSON.parse(localStorage.getItem("cindy-settings") || "{}"); } catch { return {}; }
        })();
        if (Number.isFinite(saved.targetSets)) targetInput.value = saved.targetSets;
        if (Number.isFinite(saved.durationMinutes)) durationInput.value = saved.durationMinutes;

        const clampInteger = (value, min, max, fallback) => {
          const parsed = Number.parseInt(value, 10);
          return Number.isFinite(parsed) ? Math.min(max, Math.max(min, parsed)) : fallback;
        };

        const readSettings = () => {
          targetSets = clampInteger(targetInput.value, 1, 999, 27);
          const minutes = clampInteger(durationInput.value, 1, 180, 20);
          targetInput.value = targetSets;
          durationInput.value = minutes;
          durationMs = minutes * 60 * 1000;
          try { localStorage.setItem("cindy-settings", JSON.stringify({ targetSets, durationMinutes: minutes })); } catch {}
        };

        const formatTime = (milliseconds, rounding = "ceil") => {
          const raw = Math.max(0, milliseconds / 1000);
          const total = rounding === "round" ? Math.round(raw) : Math.ceil(raw);
          const minutes = Math.floor(total / 60);
          const seconds = total % 60;
          return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        };

        const formatPace = (milliseconds) => `${milliseconds < 0 ? "+" : ""}${formatTime(Math.abs(milliseconds))}`;

        const getRoundElapsed = () => state === "running" && roundStartedAt
          ? roundElapsedMs + Date.now() - roundStartedAt
          : roundElapsedMs;

        const resetPacing = () => {
          currentSetBudgetMs = durationMs / targetSets;
          roundElapsedMs = 0;
          roundStartedAt = 0;
          lastSetDurationMs = null;
        };

        const prepareWorkout = () => {
          readSettings();
          remainingMs = durationMs;
          setsDone = 0;
          resetPacing();
        };

        const updateNextBudget = () => {
          const roundsLeft = targetSets - setsDone;
          currentSetBudgetMs = roundsLeft > 0
            ? Math.max(1000, remainingMs / roundsLeft)
            : Math.max(1000, durationMs / targetSets);
        };

        const showToast = (message) => {
          toastEl.textContent = message;
          toastEl.classList.add("is-visible");
          clearTimeout(toastHandle);
          toastHandle = setTimeout(() => toastEl.classList.remove("is-visible"), 1800);
        };

        const setStoryBackground = (preset) => {
          storyBackground = backgroundPresets.has(preset) ? preset : "dawn";
          resultSheet.dataset.background = storyBackground;
          backgroundChoices.forEach((choice) => {
            choice.setAttribute("aria-pressed", String(choice.dataset.background === storyBackground));
          });
          try { localStorage.setItem("round27-story-background", storyBackground); } catch {}
        };

        const animateRoundCount = () => {
          setCountEl.classList.remove("is-bumping");
          void setCountEl.offsetWidth;
          setCountEl.classList.add("is-bumping");
          setTimeout(() => setCountEl.classList.remove("is-bumping"), 320);
        };

        const beep = (frequency = 720, delay = 0) => {
          setTimeout(() => {
            try {
              const AudioContext = window.AudioContext || window.webkitAudioContext;
              if (!AudioContext) return;
              const context = new AudioContext();
              const oscillator = context.createOscillator();
              const gain = context.createGain();
              oscillator.frequency.value = frequency;
              gain.gain.setValueAtTime(.0001, context.currentTime);
              gain.gain.exponentialRampToValueAtTime(.13, context.currentTime + .01);
              gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + .16);
              oscillator.connect(gain).connect(context.destination);
              oscillator.start();
              oscillator.stop(context.currentTime + .18);
              oscillator.addEventListener("ended", () => context.close());
            } catch {}
          }, delay);
        };

        const nativeBridge = window.Round27Native;

        const haptic = (kind = "light") => {
          if (nativeBridge?.isNative) {
            nativeBridge.haptic(kind).catch(() => {});
            return;
          }
          if (navigator.vibrate) navigator.vibrate(kind === "heavy" ? 80 : 25);
        };

        const render = () => {
          timerEl.textContent = formatTime(remainingMs);
          timerEl.classList.toggle("is-low", remainingMs > 0 && remainingMs <= 60000);
          timeFillEl.style.width = `${Math.min(100, Math.max(0, (1 - remainingMs / durationMs) * 100))}%`;

          const roundRemaining = currentSetBudgetMs - getRoundElapsed();
          roundTimerEl.textContent = state === "idle" ? formatTime(currentSetBudgetMs, "round") : formatPace(roundRemaining);
          roundTimerEl.classList.toggle("is-over", roundRemaining < 0 && state !== "finished");
          nextPaceEl.textContent = setsDone < targetSets ? formatTime(currentSetBudgetMs, "round") : "EXTRA";
          lastSetTimeEl.textContent = lastSetDurationMs === null ? "—" : formatTime(lastSetDurationMs, "round");

          setCountEl.firstChild.nodeValue = setsDone;
          setGoalEl.textContent = `/${targetSets}`;
          goalBadgeEl.textContent = `GOAL ${targetSets}`;
          setFillEl.style.width = `${Math.min(100, setsDone / targetSets * 100)}%`;

          const labels = { idle: "READY", running: "LIVE", paused: "PAUSED", finished: "DONE" };
          statusTextEl.textContent = labels[state];
          startBtn.textContent = state === "running" ? "PAUSE" : state === "paused" ? "RESUME" : state === "finished" ? "NEW" : "START";
          completeBtn.disabled = state === "idle" || state === "finished";
          undoBtn.disabled = state === "idle" || state === "finished" || setsDone === 0;
          resultBtn.disabled = setsDone === 0;
          setupBtn.disabled = state !== "idle";
          document.body.classList.toggle("is-running", state === "running");
          document.body.classList.toggle("is-paused", state === "paused");
          document.body.classList.toggle("is-finished", state === "finished");
        };

        const finishWorkout = () => {
          roundElapsedMs = getRoundElapsed();
          roundStartedAt = 0;
          clearInterval(tickHandle);
          tickHandle = null;
          remainingMs = 0;
          state = "finished";
          render();
          beep(520);
          beep(760, 220);
          showToast(`${setsDone} ROUNDS COMPLETE`);
          haptic("success");
        };

        const tick = () => {
          remainingMs = Math.max(0, endAt - Date.now());
          if (remainingMs <= 0) finishWorkout();
          else render();
        };

        const startTimer = () => {
          if (state === "idle" || state === "finished") prepareWorkout();
          endAt = Date.now() + remainingMs;
          roundStartedAt = Date.now();
          state = "running";
          clearInterval(tickHandle);
          tickHandle = setInterval(tick, 100);
          tick();
        };

        const pauseTimer = () => {
          remainingMs = Math.max(0, endAt - Date.now());
          roundElapsedMs = getRoundElapsed();
          roundStartedAt = 0;
          clearInterval(tickHandle);
          tickHandle = null;
          state = "paused";
          render();
        };

        const completeRound = () => {
          if (state === "idle" || state === "finished") return;
          if (state === "running") remainingMs = Math.max(0, endAt - Date.now());
          roundElapsedMs = getRoundElapsed();
          roundStartedAt = 0;
          lastSetDurationMs = roundElapsedMs;
          setsDone += 1;
          updateNextBudget();
          roundElapsedMs = 0;
          if (state === "running") roundStartedAt = Date.now();
          if (setsDone === targetSets) { beep(920); showToast("GOAL REACHED"); }
          haptic(setsDone === targetSets ? "heavy" : "light");
          render();
          animateRoundCount();
        };

        const undoRound = () => {
          if (setsDone === 0 || state === "idle" || state === "finished") return;
          setsDone -= 1;
          updateNextBudget();
          render();
        };

        const resetWorkout = () => {
          if (state !== "idle" && Date.now() > resetArmUntil) {
            resetArmUntil = Date.now() + 1800;
            showToast("TAP RESET AGAIN");
            return;
          }
          clearInterval(tickHandle);
          tickHandle = null;
          prepareWorkout();
          state = "idle";
          render();
          showToast("RESET");
        };

        const applyChallengePreset = () => {
          targetInput.value = 27;
          durationInput.value = 20;
          prepareWorkout();
          render();
          closeSetup();
          showToast("27 ROUND CHALLENGE");
        };

        const openSetup = () => {
          if (state !== "idle") return;
          setupSheet.classList.add("is-open");
          setupSheet.setAttribute("aria-hidden", "false");
          targetInput.focus();
        };

        const closeSetup = () => {
          setupSheet.classList.remove("is-open");
          setupSheet.setAttribute("aria-hidden", "true");
        };

        const getResultStats = () => {
          const elapsed = Math.max(0, durationMs - remainingMs);
          return {
            rounds: setsDone,
            elapsed,
            average: setsDone > 0 ? elapsed / setsDone : 0,
            pullups: setsDone * 5,
            pushups: setsDone * 10,
            squats: setsDone * 15,
            date: new Date().toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" }).toUpperCase(),
          };
        };

        const syncResult = () => {
          const stats = getResultStats();
          resultDateEl.textContent = stats.date;
          resultRoundsEl.textContent = stats.rounds;
          resultTotalTimeEl.textContent = formatTime(stats.elapsed, "round");
          resultAverageEl.textContent = formatTime(stats.average, "round");
          resultPullupsEl.textContent = stats.pullups;
          resultPushupsEl.textContent = stats.pushups;
          resultSquatsEl.textContent = stats.squats;
          return stats;
        };

        const openResult = () => {
          if (setsDone === 0) return;
          if (state === "running") pauseTimer();
          syncResult();
          resultSheet.classList.add("is-open");
          resultSheet.setAttribute("aria-hidden", "false");
        };

        const closeResult = () => {
          resultSheet.classList.remove("is-open");
          resultSheet.setAttribute("aria-hidden", "true");
        };

        const loadImage = (src) => new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = src;
        });

        const drawCover = (context, image, width, height) => {
          const scale = Math.max(width / image.width, height / image.height);
          const drawWidth = image.width * scale;
          const drawHeight = image.height * scale;
          context.drawImage(image, (width - drawWidth) / 2, (height - drawHeight) / 2, drawWidth, drawHeight);
        };

        const drawStoryBackground = async (context, preset, width, height) => {
          const source = backgroundAssets[preset] || backgroundAssets.dawn;
          drawCover(context, await loadImage(source), width, height);
        };

        const fitCanvasText = (context, text, maxWidth, maxSize, weight = 900, family = "Arial", minSize = 14, spacing = 0) => {
          let size = maxSize;
          context.letterSpacing = `${spacing}px`;
          while (size > minSize) {
            context.font = `${weight} ${size}px ${family}`;
            if (context.measureText(String(text)).width <= maxWidth) break;
            size -= 2;
          }
          return size;
        };

        const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });

        const saveStory = async () => {
          saveStoryBtn.disabled = true;
          saveStoryBtn.textContent = "SAVING…";
          try {
            const stats = syncResult();
            const canvas = document.createElement("canvas");
            canvas.width = 1080;
            canvas.height = 1920;
            const context = canvas.getContext("2d");
            context.imageSmoothingEnabled = true;
            context.imageSmoothingQuality = "high";
            await drawStoryBackground(context, storyBackground, canvas.width, canvas.height);

            const shade = context.createLinearGradient(0, 0, 0, canvas.height);
            shade.addColorStop(0, "rgba(0,0,0,.34)");
            shade.addColorStop(.58, "rgba(0,0,0,.7)");
            shade.addColorStop(1, "rgba(0,0,0,.96)");
            context.fillStyle = shade;
            context.fillRect(0, 0, canvas.width, canvas.height);

            context.textBaseline = "alphabetic";
            context.fillStyle = "#fff";
            context.textAlign = "left";
            fitCanvasText(context, "ROUND 27", 420, 54, 900);
            context.fillText("ROUND 27", 76, 114);
            context.textAlign = "right";
            context.fillStyle = "#c2c2c2";
            fitCanvasText(context, stats.date, 360, 23, 800);
            context.fillText(stats.date, 1004, 110);

            context.strokeStyle = "rgba(255,255,255,.32)";
            context.lineWidth = 2;
            context.beginPath();
            context.moveTo(76, 154);
            context.lineTo(1004, 154);
            context.stroke();

            context.textAlign = "left";
            context.fillStyle = "#c8c8c8";
            fitCanvasText(context, "WORKOUT COMPLETE", 520, 24, 800, "Arial", 18, 2);
            context.fillText("WORKOUT COMPLETE", 76, 272);
            context.fillStyle = "#fff";
            fitCanvasText(context, String(stats.rounds), 900, 360, 900, "Impact, Arial Narrow, Arial", 180);
            context.fillText(String(stats.rounds), 62, 635);
            fitCanvasText(context, "ROUNDS", 300, 28, 900, "Arial", 20, 6);
            context.fillText("ROUNDS", 78, 704);
            context.letterSpacing = "0px";

            const metricTop = 840;
            context.fillStyle = "rgba(0,0,0,.7)";
            context.fillRect(76, metricTop, 928, 250);
            context.strokeStyle = "rgba(255,255,255,.3)";
            context.strokeRect(76, metricTop, 928, 250);
            context.beginPath();
            context.moveTo(540, metricTop);
            context.lineTo(540, metricTop + 250);
            context.stroke();

            context.fillStyle = "#a8a8a8";
            fitCanvasText(context, "TOTAL TIME", 380, 20, 800, "Arial", 15, 1);
            context.fillText("TOTAL TIME", 112, metricTop + 62);
            fitCanvasText(context, "AVG / ROUND", 380, 20, 800, "Arial", 15, 1);
            context.fillText("AVG / ROUND", 576, metricTop + 62);
            context.fillStyle = "#fff";
            const totalTimeText = formatTime(stats.elapsed, "round");
            const averageText = formatTime(stats.average, "round");
            fitCanvasText(context, totalTimeText, 380, 76, 900, "Arial", 46);
            context.fillText(totalTimeText, 112, metricTop + 164);
            fitCanvasText(context, averageText, 380, 76, 900, "Arial", 46);
            context.fillText(averageText, 576, metricTop + 164);

            const repsTop = 1140;
            const repWidth = 928 / 3;
            context.strokeStyle = "rgba(255,255,255,.3)";
            context.strokeRect(76, repsTop, 928, 232);
            for (let index = 1; index < 3; index += 1) {
              context.beginPath();
              context.moveTo(76 + repWidth * index, repsTop);
              context.lineTo(76 + repWidth * index, repsTop + 232);
              context.stroke();
            }

            const reps = [
              [stats.pullups, "PULL-UPS"],
              [stats.pushups, "PUSH-UPS"],
              [stats.squats, "SQUATS"],
            ];
            context.textAlign = "center";
            reps.forEach(([value, label], index) => {
              const center = 76 + repWidth * index + repWidth / 2;
              context.fillStyle = "#fff";
              fitCanvasText(context, String(value), repWidth - 44, 68, 900, "Arial", 38);
              context.fillText(String(value), center, repsTop + 108);
              context.fillStyle = "#aaa";
              fitCanvasText(context, label, repWidth - 36, 18, 800, "Arial", 13, 1);
              context.fillText(label, center, repsTop + 164);
            });

            context.textAlign = "left";
            context.fillStyle = "#fff";
            fitCanvasText(context, "CINDY / AMRAP 20", 600, 28, 900, "Arial", 18);
            context.fillText("CINDY / AMRAP 20", 76, 1754);
            context.fillStyle = "#9b9b9b";
            fitCanvasText(context, "5 PULL-UPS  ·  10 PUSH-UPS  ·  15 SQUATS", 900, 18, 800, "Arial", 13, 1);
            context.fillText("5 PULL-UPS  ·  10 PUSH-UPS  ·  15 SQUATS", 76, 1802);
            context.letterSpacing = "0px";

            const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
            if (!blob) throw new Error("Image export failed");
            const fileName = `round-27-${new Date().toISOString().slice(0, 10)}.png`;
            if (nativeBridge?.isNative) {
              const saved = await nativeBridge.sharePng(await blobToDataUrl(blob), fileName);
              showToast(saved === false ? "SAVE CANCELED" : nativeBridge.platform === "windows" ? "STORY SAVED" : "SHARE READY");
            } else {
              const url = URL.createObjectURL(blob);
              const link = document.createElement("a");
              link.href = url;
              link.download = fileName;
              document.body.appendChild(link);
              link.click();
              link.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
              showToast("STORY SAVED");
            }
          } catch {
            showToast("SAVE FAILED");
          } finally {
            saveStoryBtn.disabled = false;
            saveStoryBtn.textContent = nativeBridge?.platform === "android" ? "SHARE STORY" : "SAVE STORY";
          }
        };

        startBtn.addEventListener("click", () => state === "running" ? pauseTimer() : startTimer());
        completeBtn.addEventListener("click", completeRound);
        undoBtn.addEventListener("click", undoRound);
        resultBtn.addEventListener("click", openResult);
        resetBtn.addEventListener("click", resetWorkout);
        setupBtn.addEventListener("click", openSetup);
        closeSetupBtn.addEventListener("click", closeSetup);
        challengePresetBtn.addEventListener("click", applyChallengePreset);
        setupSheet.addEventListener("click", (event) => { if (event.target === setupSheet) closeSetup(); });
        applySetupBtn.addEventListener("click", () => { prepareWorkout(); render(); closeSetup(); });
        saveStoryBtn.addEventListener("click", saveStory);
        closeResultBtn.addEventListener("click", closeResult);
        backgroundChoices.forEach((choice) => choice.addEventListener("click", () => setStoryBackground(choice.dataset.background)));

        if (nativeBridge?.isNative) {
          saveStoryBtn.textContent = nativeBridge.platform === "windows" ? "SAVE STORY" : "SHARE STORY";
          fullscreenBtn.hidden = true;
          window.addEventListener("round27:native-back", (event) => {
            if (resultSheet.classList.contains("is-open")) {
              event.preventDefault();
              closeResult();
            } else if (setupSheet.classList.contains("is-open")) {
              event.preventDefault();
              closeSetup();
            } else if (state === "running") {
              event.preventDefault();
              pauseTimer();
              showToast("PAUSED");
            }
          });
        }

        fullscreenBtn.addEventListener("click", async () => {
          try {
            if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
            else await document.exitFullscreen();
          } catch { showToast("FULLSCREEN UNAVAILABLE"); }
        });

        document.addEventListener("fullscreenchange", () => { fullscreenBtn.textContent = document.fullscreenElement ? "EXIT" : "FULLSCREEN"; });
        document.addEventListener("keydown", (event) => {
          if (["INPUT", "TEXTAREA"].includes(document.activeElement?.tagName)) return;
          if (event.code === "Space") { event.preventDefault(); completeRound(); }
          if (event.key.toLowerCase() === "p" && state !== "idle" && state !== "finished") state === "running" ? pauseTimer() : startTimer();
          if (event.key === "Escape") { closeSetup(); closeResult(); }
        });

        try { setStoryBackground(localStorage.getItem("round27-story-background") || "dawn"); } catch { setStoryBackground("dawn"); }
        prepareWorkout();
        render();
      })();
    </script>
  </body>
</html>
