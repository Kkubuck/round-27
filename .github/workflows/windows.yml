name: Desktop release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check:desktop
      - run: npm run desktop:package

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            Get-ChildItem release/portable -File -Filter "Round-27-Portable-*.exe"
            Get-ChildItem release/installer -File -Filter "Round-27-Setup-*.exe"
          ) | Sort-Object Name
          if ($files.Count -ne 2) {
            throw "Expected two release executables, found $($files.Count)."
          }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v6
        with:
          name: round-27-x64
          path: |
            release/portable/Round-27-Portable-*.exe
            release/installer/Round-27-Setup-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          name: round-27-x64
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/installer/*.exe
          release/portable/*.exe
          release/SHA256SUMS.txt
          --generate-notes
          --title "Round 27 $GITHUB_REF_NAME"
